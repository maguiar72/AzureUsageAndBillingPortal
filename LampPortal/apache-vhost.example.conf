# =====================================================================
#  Exemplo de VirtualHost Apache para o Portal Azure (LAMP)
#
#  Copie para /etc/apache2/sites-available/azure-portal.conf, ajuste os
#  caminhos/dominio e ative:
#
#      sudo a2ensite azure-portal
#      sudo systemctl reload apache2
#
#  IMPORTANTE: o DocumentRoot aponta para .../public para que src/,
#  config/ e runtime/ NAO fiquem acessiveis pela web.
# =====================================================================
<VirtualHost *:80>
    ServerName portal.exemplo.com.br
    DocumentRoot /var/www/azure-portal/public

    <Directory /var/www/azure-portal/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/azure-portal-error.log
    CustomLog ${APACHE_LOG_DIR}/azure-portal-access.log combined
</VirtualHost>

# Para HTTPS (recomendado em producao), use o Certbot / Let's Encrypt:
#   sudo certbot --apache -d portal.exemplo.com.br
